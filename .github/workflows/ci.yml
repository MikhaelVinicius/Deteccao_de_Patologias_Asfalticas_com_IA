name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src

      - name: Unit tests
        run: pytest -q
